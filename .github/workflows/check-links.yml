name: check-links

on:
  push:
    branches: [main]
    paths: ['README.md', 'NOTES.md', 'scripts/**', '.github/workflows/check-links.yml']
  pull_request:
    paths: ['README.md', 'NOTES.md', 'scripts/**']
  schedule:
    # Monthly, so link rot and archived projects surface without manual auditing.
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify every linked repository resolves
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check-links.sh --metadata
